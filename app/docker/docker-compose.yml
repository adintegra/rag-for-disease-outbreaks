version: "3.9"
name: pgvector

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgvector_data:/var/lib/postgresql/data
    shm_size: 128mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME}

volumes:
  pgvector_data:
